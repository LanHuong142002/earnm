# Render Blueprint for the earnm API. See docs/deploy.md for setup steps.
# Secret values (DATABASE_URL, INTERNAL_SECRET, TRUST_PROXY, and the optional INVITE_INSTALL_URL, INVITE_CODE_KEY and the CLOUDINARY_* variables) are entered in
# Render's dashboard, never in this file.
services:
  - type: web
    name: earnm-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run on every start, before the health check, and are never rolled
    # back: they must stay backward-compatible with the previous version (docs/deploy.md, section 11).
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: TRUST_PROXY
        sync: false
      # Optional: https:// link where invitees install the app. Leave empty if unused.
      - key: INVITE_INSTALL_URL
        sync: false
      # Optional: separate key (32+ characters) for invite codes. Empty = derived from INTERNAL_SECRET. Changing it voids pending invites.
      - key: INVITE_CODE_KEY
        sync: false
      # Optional: Cloudinary account for task photos. Photos are on only when all three are set.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
